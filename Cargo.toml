[package]
name = "rustxng"
version = "0.27.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "SearXNG を Rust で書き直したメタ検索エンジン (AGPL-3.0-or-later)"
repository = "https://github.com/sahenjp/rustxng"
readme = "README.md"
keywords = ["searxng", "metasearch", "search-engine", "privacy"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "net", "process", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2", "json", "gzip", "brotli", "deflate", "cookies", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
askama = "0.16"
scraper = "0.20"
url = "2"
percent-encoding = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace"] }
quick-xml = { version = "0.41", features = ["serialize"] }
thiserror = "2"
regex = "1"
sha2 = "0.11"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
postgres = { version = "0.19", optional = true }
mysql = { version = "28.0.3", default-features = false, features = ["minimal"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
mongodb = { version = "3", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls"], optional = true }
bson = { version = "3", optional = true }
tantivy = "0.27"
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }

tempfile = "3"
semver = "1"
self-replace = "1"

[features]
default = ["db-engines"]
# Database backed engines (postgresql, mysql, mariadb, sqlite, mongodb).
# Disable with --no-default-features for a smaller binary.
db-engines = ["dep:postgres", "dep:mysql", "dep:rusqlite", "dep:mongodb", "dep:bson"]


[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "server", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.clippy]
# Raising MSRV to 1.88 enables let-chain suggestions across existing parsers.
# Keep explicit nested branches as a supported style; all other warnings stay errors in CI.
collapsible_if = "allow"
# Existing upstream plural rules intentionally retain modulo expressions.
manual_is_multiple_of = "allow"
