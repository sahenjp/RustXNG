name: release-please

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.select.outputs.created }}
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          FINISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$sha" != "$FINISHED_SHA" ]; then
            echo 'A newer main commit is waiting for its own CI; no release action.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        if: steps.current.outputs.ready == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - id: select
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, subprocess, tomllib
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          tag, sha = os.environ['TAG'], os.environ['SOURCE_SHA']
          if os.environ['CREATED'] != 'true':
              cargo = api('contents/Cargo.toml?ref=main')
              version = tomllib.loads(base64.b64decode(cargo['content']).decode())['package']['version']
              pending = [r for r in api('releases?per_page=100') if r['draft'] and r['tag_name'] == 'v' + version and r['author']['login'] == 'github-actions[bot]']
              if pending:
                  tag = pending[0]['tag_name']
                  sha = api('commits/' + pending[0]['target_commitish'])['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('created=' + ('true' if tag and sha else 'false') + '\n')
              out.write('tag=' + tag + '\nsha=' + sha + '\n')
          PYTHON
      - name: Explicitly start CI for bot-created release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          for pr in json.loads(os.environ['PRS']):
              data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{pr["number"]}']))
              if data['head']['repo']['full_name'] != repo or data['base']['ref'] != 'main':
                  raise SystemExit('unexpected release PR source')
              subprocess.run(['gh', 'workflow', 'run', 'ci.yml', '--repo', repo, '--ref', data['head']['ref']], check=True)
          PY

  publish:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.sha }}
      dry_run: false
