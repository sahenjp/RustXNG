name: release-please

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.select.outputs.created }}
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          FINISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$sha" != "$FINISHED_SHA" ]; then
            echo 'A newer main commit is waiting for its own CI; no release action.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.current.outputs.ready == 'true'
        with:
          ref: ${{ steps.current.outputs.sha }}
          persist-credentials: false
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        if: steps.current.outputs.ready == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true
      - id: select
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: python3 tools/release_state.py
      - id: baseline
        if: steps.select.outputs.prepare_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$sha" = "$EXPECTED_SHA" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main is waiting for CI; skip PR preparation.'
          fi
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        if: steps.baseline.outputs.ready == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true

  publish:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.sha }}
      dry_run: false
