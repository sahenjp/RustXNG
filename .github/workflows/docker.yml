name: container-release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      dry_run:
        type: boolean
        default: true
    outputs:
      image:
        value: ${{ jobs.manifest.outputs.image }}
      digest:
        value: ${{ jobs.manifest.outputs.digest }}

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_SHA: ${{ inputs.source_ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: rustxng-verify:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_ref }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Verify native architecture, version and health
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual=$(docker image inspect --format '{{.Architecture}}' rustxng-verify:local)
          test "$actual" = "$ARCH"
          bash tools/smoke_container.sh rustxng-verify:local "${RELEASE_TAG#v}"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push a unique staging image after smoke succeeds
        if: ${{ !inputs.dry_run }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          staging="staging-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag rustxng-verify:local "$image:$staging"
          docker push "$image:$staging"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$staging")
          [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-info
          jq -n --arg ref "$ref" '{ref: $ref}' > "image-info/$ARCH.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.dry_run }}
        with:
          name: container-${{ matrix.arch }}
          path: image-info/*
          if-no-files-found: error
          retention-days: 7

  manifest:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: container-*
          merge-multiple: true
          path: image-info
      - id: manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          if docker buildx imagetools inspect --raw "$image:$version" > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            # Stable version tags are immutable; a retry may only reuse the same source.
            jq -e '.manifests | length == 2' "$RUNNER_TEMP/existing.json"
            jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]' "$RUNNER_TEMP/existing.json"
            for arch in amd64 arm64; do
              docker pull --platform "linux/$arch" "$image:$version"
              revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image:$version")
              test "$revision" = "$SOURCE_SHA" || { echo 'version tag points at another source' >&2; exit 1; }
            done
            digest=$(docker buildx imagetools inspect "$image:$version" | awk '/^Digest:/ {print $2; exit}')
          else
            amd64=$(jq -r .ref image-info/amd64.json)
            arm64=$(jq -r .ref image-info/arm64.json)
            [[ "$amd64" =~ @sha256:[0-9a-f]{64}$ && "$arm64" =~ @sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools create --tag "$image:$version" --metadata-file "$RUNNER_TEMP/manifest.json" "$amd64" "$arm64"
            digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
