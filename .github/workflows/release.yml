name: release

# Publish the platform binaries on an annotated version tag.
#
# rustdsh installs this sidecar with `rdsh rustxng install`, which reads
# /releases/latest and picks the asset whose name is
# `rustxng-<tag>-<rustc triple>` (plus `.exe` on Windows). Keep that shape:
# the tag is part of the file name, so one rule matches every platform.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    # Re-run the release for an existing tag. The workflow file is taken from
    # the dispatched ref, so a broken step can be fixed without moving the tag.
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.4.0'
        required: true
        type: string
      dry_run:
        description: 'Build and verify everything, upload nothing'
        required: false
        type: boolean
        default: false
      legacy_assets:
        description: 'Only the pre-ARM64 asset set (tags released before Linux ARM64 support)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    # Decide which targets this run builds and publish requires. A normal tag
    # push builds everything. Re-running an older tag with legacy_assets keeps
    # the asset set it was released with (no Linux ARM64 binary).
    #
    # Matrix fields: os/target/artifact as before; arch is the `file` output
    # fragment a Linux binary must show; musl installs musl-tools; slim_check
    # also builds --no-default-features; since_arm64 marks targets a legacy
    # re-run leaves out.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - id: plan
        shell: bash
        env:
          LEGACY: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_assets || false }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/all.json" <<'JSON'
          [
            {"comment": "glibc 2.35 floor: build on 22.04 so 24.04 and 25.x still run it.",
             "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "artifact": "rustxng", "arch": "x86-64"},
            {"comment": "Native build on the GitHub-hosted arm64 runner (no cross toolchain, no emulation). Ubuntu 24.04 sets a glibc 2.39 floor. The slim build is checked here because the x86_64 CI jobs do not cover this target.",
             "os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "artifact": "rustxng", "arch": "aarch64",
             "slim_check": true, "since_arm64": true},
            {"comment": "Static: runs on any x86_64 Linux, including Alpine.",
             "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-musl", "artifact": "rustxng", "arch": "x86-64", "musl": true},
            {"comment": "Both macOS targets build on the arm64 runner: the Apple toolchain cross-compiles to x86_64, and the Intel runner labels are retired or queue for hours.",
             "os": "macos-15", "target": "aarch64-apple-darwin", "artifact": "rustxng"},
            {"os": "macos-15", "target": "x86_64-apple-darwin", "artifact": "rustxng"},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "artifact": "rustxng.exe"}
          ]
          JSON
          if [ "$LEGACY" = "true" ]; then
            filter='map(select(.since_arm64 != true))'
          else
            filter='.'
          fi
          matrix="$(jq -c "$filter | {include: map(del(.comment))}" "$RUNNER_TEMP/all.json")"
          targets="$(jq -r "$filter | map(.target) | join(\" \")" "$RUNNER_TEMP/all.json")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"
          echo "targets: $targets"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Check the slim build (no database engines)
        if: matrix.slim_check
        shell: bash
        # A separate target dir keeps the shipped default-feature binary apart.
        run: cargo build --release --locked --no-default-features --target "${{ matrix.target }}" --target-dir target/slim
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Check the binary answers
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          test -f "$binary"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # The runner must execute the binary natively: refuse a binary
            # built for a different CPU than the target name claims.
            command -v file >/dev/null || { sudo apt-get update && sudo apt-get install -y file; }
            file "$binary"
            file "$binary" | grep -qF "${{ matrix.arch }}" \
              || { echo "binary is not ${{ matrix.arch }}" >&2; exit 1; }
            "$binary" --version
          fi
      - name: Agent setup smoke test (offline)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          if [ ! -f tools/smoke_agent_setup.py ]; then
            # Tags older than the smoke test cannot run it; a fresh tag must.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::tools/smoke_agent_setup.py is missing at $RELEASE_TAG; smoke test skipped"
              exit 0
            fi
            echo "tools/smoke_agent_setup.py is missing at $RELEASE_TAG" >&2
            exit 1
          fi
          python3 tools/smoke_agent_setup.py --binary "$binary"
      - name: Name the asset after the tag and the target
        shell: bash
        run: |
          set -euo pipefail
          source="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          name="rustxng-${RELEASE_TAG}-${{ matrix.target }}"
          case "${{ matrix.artifact }}" in
            *.exe) name="$name.exe" ;;
          esac
          mkdir -p dist
          cp "$source" "dist/$name"
          # macOS ships shasum, not sha256sum. Record the bare file name so
          # `sha256sum --check` works from the download directory.
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "$name" > "$name.sha256" )
          else
            ( cd dist && shasum -a 256 "$name" > "$name.sha256" )
          fi
          cat "dist/$name.sha256"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustxng-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: rustxng-*
          merge-multiple: true
          path: dist
      - name: Require the complete, expected asset set
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ needs.plan.outputs.targets }}"
          test -n "$expected" || { echo "empty target plan" >&2; exit 1; }
          for target in $expected; do
            case "$target" in
              *windows*) name="rustxng-${RELEASE_TAG}-$target.exe" ;;
              *) name="rustxng-${RELEASE_TAG}-$target" ;;
            esac
            test -s "dist/$name" || { echo "missing asset: $name" >&2; exit 1; }
            test -s "dist/$name.sha256" || { echo "missing sidecar: $name.sha256" >&2; exit 1; }
          done
          ls -l dist
      - name: Compose the release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # Keep the section for this version; fall back to the tag when the
          # changelog has no entry yet.
          awk -v want="## [$version]" '
            $0 ~ "^" want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/section.md"
          if [ -s "$RUNNER_TEMP/section.md" ]; then
            { echo "# RustXNG $RELEASE_TAG"; echo; cat "$RUNNER_TEMP/section.md"; } > "$RUNNER_TEMP/notes.md"
          else
            { echo "# RustXNG $RELEASE_TAG"; echo; echo "チェックサムは各アセットの .sha256 を参照してください。"; } > "$RUNNER_TEMP/notes.md"
          fi
          echo "--- notes ---"
          head -20 "$RUNNER_TEMP/notes.md"
      - name: Create the release when it does not exist
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; adding missing assets"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "RustXNG $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Upload only the assets the release does not have
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite a published asset: a rebuild differs byte for byte,
          # and replacing it would invalidate every checksum already handed out.
          # An asset that is already published keeps its bytes; its sidecar is
          # regenerated from those bytes so the pair still agrees.
          existing="$RUNNER_TEMP/existing"
          mkdir -p "$existing"
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/have.txt" 2>/dev/null; then
            # An existing release may still have no assets (a previous publish
            # run created it and stopped): gh refuses to download nothing.
            if [ -s "$RUNNER_TEMP/have.txt" ]; then
              gh release download "$RELEASE_TAG" --dir "$existing" >/dev/null
            fi
          else
            : > "$RUNNER_TEMP/have.txt"
          fi
          for file in dist/*; do
            name="$(basename "$file")"
            case "$name" in *.sha256) continue ;; esac
            if grep -qxF "$name" "$RUNNER_TEMP/have.txt"; then
              echo "keep published bytes: $name"
              cp "$existing/$name" "dist/$name"
              ( cd dist && sha256sum "$name" > "$name.sha256" )
            fi
          done
          pending=()
          for file in dist/*; do
            name="$(basename "$file")"
            if grep -qxF "$name" "$RUNNER_TEMP/have.txt"; then
              echo "keep: $name"
            else
              pending+=("$file")
            fi
          done
          if [ ${#pending[@]} -eq 0 ]; then
            echo "nothing to upload"
          else
            gh release upload "$RELEASE_TAG" "${pending[@]}"
          fi
      - name: Attach the licence files
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # AGPL-3.0 requires the licence text to travel with the binaries.
          # These are static, so a published copy is never replaced.
          for file in LICENSE NOTICE; do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qxF "$file"; then
              echo "$file already attached"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
      - name: Verify the published asset set
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/published.txt"
          missing=0
          for file in dist/*; do
            name="$(basename "$file")"
            if ! grep -qxF "$name" "$RUNNER_TEMP/published.txt"; then
              echo "not published: $name" >&2
              missing=1
            fi
          done
          cat "$RUNNER_TEMP/published.txt"
          # Prove the published bytes match the published checksums, including
          # the assets this run did not build (an earlier upload).
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          gh release download "$RELEASE_TAG" --dir "$verify" --clobber
          ( cd "$verify" && sha256sum --check ./*.sha256 )
          exit "$missing"
