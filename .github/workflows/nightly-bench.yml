name: nightly-offline

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  retrieval-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Offline evaluation and release policy tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Verify provider inventory
        run: python3 tools/provider_inventory.py --check
      - name: Reproduce retained observations without provider requests
        run: |
          python3 tools/rescore_saved_benchmarks.py --output "$RUNNER_TEMP/rescore.json"
          cmp bench/rescore-2026-11-03.json "$RUNNER_TEMP/rescore.json"
      - name: Publish result
        run: echo 'Offline retrieval fixtures, saved-observation rescore and provider inventory passed. No external search providers were queried.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-rescore
          path: ${{ runner.temp }}/rescore.json
          retention-days: 30
