name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build and test
        run: cargo test --all-targets
      - name: Offline evaluation tests
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          python tools/provider_inventory.py --check
      - name: Build the server binary
        run: cargo build --locked --bin rustxng
      - name: Agent setup smoke test (offline)
        # The script resolves the .exe suffix on Windows.
        run: python tools/smoke_agent_setup.py --binary target/debug/rustxng
      - name: Build the example
        run: cargo build --locked --example benchmark
      - name: Lint the Japanese docs
        if: runner.os == 'Linux'
        run: npx --yes markdownlint-cli2 "*.md" "docs/*.md" 

  no-default-features:
    # The documented slim build (no database engines) must keep compiling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-default-features
      - run: cargo build --release --locked --no-default-features

  linux-arm64:
    # Native Linux ARM64 (aarch64-unknown-linux-gnu) on the GitHub-hosted arm64
    # runner: no cross toolchain and no emulation. Mirrors the release build,
    # which publishes this target. Containers stay x86_64 only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-arm64
      - name: Runner is native aarch64
        run: test "$(uname -m)" = aarch64
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build and test
        run: cargo test --locked --all-targets
      - name: Build the server binary
        run: cargo build --locked --bin rustxng
      - name: The binary is aarch64 and answers
        run: |
          set -euo pipefail
          file target/debug/rustxng | tee /dev/stderr | grep -qF aarch64
          target/debug/rustxng --version
      - name: Agent setup smoke test (offline)
        run: python3 tools/smoke_agent_setup.py --binary target/debug/rustxng
      - name: Check the slim build (no database engines)
        run: cargo build --locked --no-default-features

  msrv:
    # Cargo.toml's rust-version must hold for the locked dependency set.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag rustxng:ci .
      - name: The image serves /healthz
        run: |
          set -euo pipefail
          docker run --detach --name rustxng-ci --publish 127.0.0.1:29483:29483 rustxng:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:29483/healthz; then
              echo "healthz ok"
              exit 0
            fi
            sleep 2
          done
          docker logs rustxng-ci
          exit 1
      - name: Stop the container
        if: always()
        run: docker rm --force rustxng-ci || true
