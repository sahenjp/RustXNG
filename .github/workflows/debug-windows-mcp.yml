name: debug-windows-mcp

# Temporary investigation workflow for the Windows tools/list hang report.
# Runs the exact reproduction on a real windows-latest runner and prints
# stdout/stderr with timings. workflow_dispatch only; delete after diagnosis.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build from source
        run: cargo build --locked --bin rustxng

      - name: Download official v0.31.0 Windows binary
        shell: bash
        run: |
          curl --fail --location --retry 3 --output rustxng-official.exe \
            "https://github.com/sahenjp/RustXNG/releases/download/v0.31.0/rustxng-v0.31.0-x86_64-pc-windows-msvc.exe"

      - name: Repro A - Git Bash printf pipe, source build, stdin closes immediately
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | RUST_LOG=info timeout 40 ./target/debug/rustxng.exe mcp > out-a.txt 2> err-a.txt || echo "exit=$?"
          echo "=== A stdout ==="; cat out-a.txt
          echo "=== A stderr ==="; cat err-a.txt

      - name: Repro B - Git Bash printf pipe, official binary, stdin closes immediately
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | RUST_LOG=info timeout 40 ./rustxng-official.exe mcp > out-b.txt 2> err-b.txt || echo "exit=$?"
          echo "=== B stdout ==="; cat out-b.txt
          echo "=== B stderr ==="; cat err-b.txt

      - name: Repro C - stdin stays open (no EOF), source build
        shell: bash
        run: |
          (printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 40) \
            | RUST_LOG=info timeout 50 ./target/debug/rustxng.exe mcp > out-c.txt 2> err-c.txt || echo "exit=$?"
          echo "=== C stdout ==="; cat out-c.txt
          echo "=== C stderr ==="; cat err-c.txt

      - name: Repro D - PowerShell pipeline (CRLF), source build
        shell: pwsh
        run: |
          $json1 = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}'
          $json2 = '{"jsonrpc":"2.0","method":"notifications/initialized"}'
          $json3 = '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $json1, $json2, $json3 | & .\target\debug\rustxng.exe mcp 2>&1 | ForEach-Object { "$_" } | Out-String | Write-Output

      - name: Repro E - Node MCP SDK client (as DSH does), source build
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install @modelcontextprotocol/sdk >/dev/null 2>&1
          cat > sdk-test.mjs <<'EOF'
          import { Client } from "@modelcontextprotocol/sdk/client/index.js";
          import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";
          const transport = new StdioClientTransport({ command: "target\\debug\\rustxng.exe", args: ["mcp"] });
          const client = new Client({ name: "win-test", version: "1.0" });
          await client.connect(transport);
          const t0 = Date.now();
          const result = await Promise.race([
            client.listTools(),
            new Promise((_, reject) => setTimeout(() => reject(new Error("tools/list timed out after 30s")), 30000)),
          ]);
          console.log("tools/list OK in", ((Date.now() - t0) / 1000).toFixed(1), "s, tools:", result.tools.length);
          await client.close();
          EOF
          timeout 60 node sdk-test.mjs || echo "node-test-exit=$?"
